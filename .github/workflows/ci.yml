name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  aot:
    name: ahead-of-time
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The sample turns the AOT and trimming analysers on, so this step alone fails the build on
      # anything the trimmer cannot follow. Publishing and running it then proves the native
      # executable actually starts and maps: the sample checks its own output and exits non-zero.
      - name: Publish ahead of time
        run: dotnet publish samples/Mapperion.Aot/Mapperion.Aot.csproj --configuration Release --runtime win-x64 --output samples/Mapperion.Aot/publish

      - name: Run the native executable
        run: ./samples/Mapperion.Aot/publish/Mapperion.Aot.exe

  performance:
    name: performance budget
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # A short job over the scenarios where a regression would actually show: the two that the
      # inlining serves, and the two where the fixed cost per call dominates. Only the hand-written
      # baseline and Mapperion run; measuring the other libraries here would treble the time and
      # tell us nothing about our own changes.
      - name: Measure
        run: >
          dotnet run --project benchmarks/Mapperion.Benchmarks/Mapperion.Benchmarks.csproj
          --configuration Release --framework net9.0 --
          --filter
          "*FlatBenchmarks.Manual" "*FlatBenchmarks.Mapperion_Runtime"
          "*FlatBenchmarks.Mapperion_RuntimeFast" "*FlatBenchmarks.Mapperion_SourceGen"
          "*NestedBenchmarks.Manual" "*NestedBenchmarks.Mapperion_Runtime"
          "*CollectionBenchmarks.Manual" "*CollectionBenchmarks.Mapperion_Runtime"
          "*CollectionBenchmarks.Mapperion_SourceGen"
          "*ConstructorBenchmarks.Manual" "*ConstructorBenchmarks.Mapperion_Runtime"
          "*ConstructorBenchmarks.Mapperion_SourceGen"
          --job short --exporters json

      - name: Compare against the budget
        run: >
          dotnet run --project benchmarks/Mapperion.Benchmarks/Mapperion.Benchmarks.csproj
          --configuration Release --framework net9.0 --no-build --
          --budget benchmarks/baseline.json BenchmarkDotNet.Artifacts/results

      - name: Keep the measurements with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results
          if-no-files-found: ignore

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack --configuration Release --output artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
